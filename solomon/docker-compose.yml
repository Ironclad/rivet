version: "3.8"

services:
  solomon:
    build: .
    container_name: solomon-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-32-byte-random-string}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-another-32-byte-secret}
      - DATABASE_URL=sqlite:///instance/solomon.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - ENABLE_WEBSOCKET=${ENABLE_WEBSOCKET:-false}
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - solomon-network

networks:
  solomon-network:
    driver: bridge
